<style>
:root{
  --green:#0b3d2e; --green2:#115740; --court:#1f7a4d;
  --clay:#c2512f; --ball:#d7f23a; --white:#f6fbf4; --ink:#0a1f17;
  --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Poppins','Noto Sans Devanagari',system-ui,sans-serif;
  background:var(--green); color:var(--white); line-height:1.55;
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
html[lang="hi"] body{font-family:'Noto Sans Devanagari','Poppins',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 20px}

/* top bar */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(11,61,46,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--ball);flex:none}
.brand b{font-weight:800;letter-spacing:.04em;font-size:15px;white-space:nowrap}
.lang{display:flex;background:rgba(0,0,0,.28);border-radius:999px;padding:3px;flex:none}
.lang button{
  border:0;background:transparent;color:var(--white);font:600 13px/1 inherit;font-family:inherit;
  padding:8px 14px;border-radius:999px;cursor:pointer;min-height:34px
}
.lang button[aria-pressed="true"]{background:var(--ball);color:var(--ink)}

/* hero */
.hero{
  position:relative;text-align:center;padding:44px 0 40px;
  background:
    radial-gradient(120% 70% at 50% 0%, #17694b 0%, transparent 70%),
    var(--green);
}
.court{position:absolute;inset:0;opacity:.18;pointer-events:none}
.hero .wrap{position:relative}
.heroLogo{
  width:128px;height:128px;border-radius:50%;object-fit:cover;margin:0 auto 22px;display:block;
  border:4px solid var(--ball);box-shadow:0 0 0 8px rgba(215,242,58,.15),0 18px 40px rgba(0,0,0,.4);
}
.badge{
  display:inline-block;background:var(--clay);color:#fff;font-weight:700;font-size:12px;
  letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:999px;margin-bottom:14px
}
h1{font-size:clamp(30px,9vw,44px);line-height:1.1;font-weight:800;letter-spacing:.01em}
h1 span{color:var(--ball)}
.tag{margin-top:12px;font-size:clamp(17px,4.6vw,20px);font-weight:600}
.sub{margin:14px auto 0;max-width:440px;opacity:.88;font-size:15.5px}

.cta{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  background:var(--ball);color:var(--ink);font-family:inherit;font-weight:800;font-size:18px;
  padding:16px 30px;border-radius:999px;border:0;cursor:pointer;min-height:56px;
  box-shadow:0 10px 0 -2px #9db81c,0 18px 30px rgba(0,0,0,.35);
  transition:transform .12s ease, box-shadow .12s ease;
}
.cta:active{transform:translateY(4px);box-shadow:0 5px 0 -2px #9db81c,0 8px 16px rgba(0,0,0,.35)}
.cta svg{width:24px;height:24px;flex:none}
.heroCta{margin-top:28px}
.note{margin-top:16px;font-size:13px;opacity:.75}

.ball{
  position:absolute;width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #efff7a, var(--ball) 55%, #a9c21a);
  box-shadow:0 8px 14px rgba(0,0,0,.3);
}
.ball::after{content:"";position:absolute;inset:3px;border:2px solid rgba(255,255,255,.75);border-color:rgba(255,255,255,.75) transparent transparent transparent;border-radius:50%;transform:rotate(-30deg)}
.b1{left:7%;top:60px;animation:bounce 2.6s ease-in-out infinite}
.b2{right:8%;top:150px;width:20px;height:20px;animation:bounce 3.1s ease-in-out .5s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@media (prefers-reduced-motion:reduce){.ball{animation:none}html{scroll-behavior:auto}}

/* sections */
section{padding:38px 0}
h2{font-size:24px;font-weight:800;text-align:center;margin-bottom:22px}
h2::after{content:"";display:block;width:54px;height:4px;border-radius:4px;background:var(--clay);margin:10px auto 0}
.grid{display:grid;gap:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;
  display:flex;gap:14px;align-items:flex-start
}
.ico{
  width:46px;height:46px;border-radius:14px;background:var(--ball);color:var(--ink);
  display:grid;place-items:center;font-size:22px;flex:none
}
.card h3{font-size:16.5px;font-weight:700;margin-bottom:2px}
.card p{font-size:14.5px;opacity:.82}

.alt{background:var(--green2)}
.steps{counter-reset:s;display:grid;gap:14px}
.step{
  counter-increment:s;display:flex;gap:14px;align-items:center;
  background:rgba(0,0,0,.2);border-radius:16px;padding:14px 16px;font-weight:600
}
.step::before{
  content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--clay);color:#fff;
  display:grid;place-items:center;font-weight:800;flex:none
}

.final{text-align:center;background:linear-gradient(180deg,var(--green),#082c21)}
.final p{opacity:.85;margin-bottom:24px}

footer{padding:26px 0 8px;text-align:center;font-size:12.5px;opacity:.65}
footer b{letter-spacing:.06em}

/* sticky bottom CTA */
.sticky{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,rgba(8,44,33,.96) 40%);
  display:flex;justify-content:center;
}
.sticky .cta{width:100%;max-width:520px;font-size:17px;padding:14px 20px;min-height:54px}

[data-i18n]{transition:opacity .15s}
</style>
</head>

      setTimeout(function(){ firing = false; }, 1500);
    });
  });
})();
</script>
